; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = 01_src

[env:esp32-c3-devkitm-1]
; Pinned platform — 6.7.0 ships ESP-IDF 5.1 with the rewritten RMT driver
; that fixes the FastLED ISR recursion crash on ESP32-C3.
platform = espressif32 @ 6.7.0
;board = seeed_xiao_esp32c3
board = esp32-c3-devkitm-1
framework = arduino
;framework = espidf

monitor_speed = 115200
; Native USB-CDC on the ESP32-C3 misinterprets DTR/RTS toggles as the
; "enter download mode" signal, so opening pio device monitor with the
; defaults can reset/drop the board instead of just observing it.
monitor_dtr = 0
monitor_rts = 0

; ESP32-C3 native USB-CDC upload quirks (no external USB-serial bridge):
;   1. The mid-upload baud switch (115200 -> 460800) crashes the CDC
;      endpoint: "No serial data received".
;   2. When the flasher stub takes over from the ROM bootloader, the
;      USB-CDC endpoint re-enumerates and the first post-stub command
;      falls into a dead window: "Unable to verify flash chip connection".
; Pinning upload_speed avoids (1); --no-stub avoids (2) by using the
; ROM bootloader for the whole upload. Slower (~60-90s) but reliable.
upload_speed = 115200
upload_flags = --no-stub

; Build flags — FastLED safety + serial debug
; ARDUINO_USB_CDC_ON_BOOT routes Arduino's Serial object onto the C3's
; native USB peripheral. Without it, Serial defaults to UART0 (unwired
; on this board), and COM9 is only the chip's USB-Serial/JTAG debug
; bridge used by esptool for flashing — not the same channel as
; Serial.print(), so all firmware logging is silently lost.
; CONFIG_NIMBLE_CPP_LOG_LEVEL / _ENABLE_RETURN_CODE_TEXT: NimBLE's own
; NIMBLE_LOGE("failed to send value, rc=%d %s", ...) inside notify() is
; compiled out at the default log level (0 = NONE). Enabling this surfaces
; the real NimBLE host error code instead of a bare notify()-returned-false.
build_flags =
	-D FASTLED_RMT_MAX_CHANNELS=1     ; ESP32-C3 has only 2 RMT channels
	-D FASTLED_RMT_BUILTIN_DRIVER=1   ; use IDF's tested RMT driver
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CONFIG_NIMBLE_CPP_LOG_LEVEL=1
	-D CONFIG_NIMBLE_CPP_ENABLE_RETURN_CODE_TEXT

lib_deps =
	h2zero/NimBLE-Arduino @ ^2.2.0
	fastled/FastLED @ ^3.7.0
	madhephaestus/ESP32Servo
	adafruit/Adafruit GFX Library
	adafruit/Adafruit SSD1306
	tzapu/WiFiManager @ ^2.0.17

; Same firmware, pushed over WiFi instead of USB — use once the robot is
; already in OTA mode (hold the debug button ~3s during normal play) and
; has printed its IP on the serial log. Pass the IP explicitly:
;   pio run -e esp32-c3-devkitm-1-ota -t upload --upload-port <robot-ip>
[env:esp32-c3-devkitm-1-ota]
extends = env:esp32-c3-devkitm-1
upload_protocol = espota
; The serial-specific quirks above don't apply over the network.
upload_flags =
